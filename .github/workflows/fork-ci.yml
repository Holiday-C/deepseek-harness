name: Fork CI

on:
  pull_request:
    branches: [custom/main]
  push:
    branches: [custom/main]

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  TZ: Asia/Shanghai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-24:
    name: node 24 / static
    runs-on: ubuntu-24.04
    env:
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Run static checks
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run check:ci:static

  node-24-coverage:
    name: node 24 / coverage
    runs-on: ubuntu-24.04
    env:
      DSH_COVERAGE_MAX_WORKERS: '2'
      DSH_COVERAGE_PARTITIONS: '2'
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      - name: Run exhaustive coverage
        run: pnpm run check:ci:coverage

  node-24-consumers:
    name: node 24 / snapshots and artifacts
    runs-on: ubuntu-24.04
    env:
      DSH_GATE_CONCURRENCY: '2'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      DSH_OXLINT_THREADS: '2'
      DSH_PUBLINT_CONCURRENCY: '2'
      DSH_SNAPSHOT_MAX_CONCURRENCY: '4'
      DSH_WEB_SNAPSHOT_WORKERS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Run compatibility, snapshot, and artifact checks
        run: pnpm run check:ci:consumers

  node-compat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.19'
            name: node 22.19
          - node: '26'
            name: node 26
    env:
      DSH_GATE_CONCURRENCY: '1'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Run compatibility smokes
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run check:node-compat

  python-sdk:
    name: python 3.10 / keyless SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
      - name: Install uv
        run: python -m pip install uv==0.11.23
      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest

  wine:
    name: windows node 24 / wine blocking
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install dependencies and Wine
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine
          wait "$install_pid"
      - name: Run the Wine Windows checks
        run: bash scripts/wine-windows-gates.sh
      - name: Shut down wineserver
        if: always()
        run: wineserver -k 2>/dev/null || true

  windows-build:
    name: windows node 24 / build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable Developer Mode
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Run blocking Windows builds
        shell: pwsh
        run: pnpm run check:ci:windows-blocking

  windows-native-tests:
    name: windows node 24 / native tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable Developer Mode
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Run Windows-specific native tests
        shell: pwsh
        run: |
          $specs = @(
            'packages/shell/tool-pwsh/tests/loader.spec.ts'
            'packages/workflow/tool-ralph/tests/integration.spec.ts'
            'packages/subprocess/subprocess-local/tests/process-exit.spec.ts'
            'packages/session/session-persistence-sqlite/tests/differential.spec.ts'
          )
          foreach ($spec in $specs) {
            pnpm exec vitest run --no-file-parallelism --testTimeout 90000 $spec
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          pnpm exec vitest run --no-file-parallelism --testTimeout 90000 packages/workflow/workflow-worker-thread/tests/workflow-worker-thread.spec.ts -t 'workerSpawnEnv injects the host temp path on win32'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  all-checks-passed:
    name: fork checks passed
    runs-on: ubuntu-24.04
    needs: [node-24, node-24-coverage, node-24-consumers, node-compat, python-sdk, wine, windows-build, windows-native-tests]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Required job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All required jobs succeeded (${{ join(needs.*.result, ', ') }})"
